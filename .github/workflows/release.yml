name: Releases

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pumpgsit-releases
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build.yml
    with:
      channel: release
