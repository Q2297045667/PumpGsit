name: Build

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      channel:
        description: Publish a stable release or a nightly prerelease
        required: true
        type: string
      version:
        description: Stable version entered by the maintainer
        required: false
        type: string
    outputs:
      release_tag:
        description: GitHub release tag
        value: ${{ jobs.wasm.outputs.release_tag }}
      plugin_version:
        description: Version embedded in PumpGsit.wasm
        value: ${{ jobs.wasm.outputs.plugin_version }}

permissions:
  contents: read
  actions: read

jobs:
  checks:
    name: Lint and run Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust with rustfmt and Clippy
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Install actionlint and shfmt
        working-directory: ${{ runner.temp }}
        run: |
          mkdir lint-tools
          curl -fsSL --retry 3 -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o lint-tools/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sha256sum -c <<'CHECKSUMS'
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  lint-tools/shfmt
          CHECKSUMS
          tar -xzf actionlint.tar.gz -C lint-tools actionlint
          chmod +x lint-tools/shfmt
          echo "$RUNNER_TEMP/lint-tools" >> "$GITHUB_PATH"

      - name: Check formatting, scripts, workflows and host tests
        run: bash .github/scripts/check.sh

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      plugin_version: ${{ steps.version.outputs.plugin_version }}
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the package version and release tag
        id: version
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag=""
          case "$BUILD_CHANNEL" in
            release)
              version=${REQUESTED_VERSION#v}
              if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Enter a stable version such as 0.1.4 or v0.1.4."
                exit 1
              fi
              tag="v$version"
              ;;
            nightly)
              # Reruns use the creation date of the original run.
              day=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[:10]')
              tag="nightly-$day-${GITHUB_SHA:0:12}"
              version="$version-nightly.${day//-/}+${GITHUB_SHA:0:12}"
              ;;
            "") ;; # Pull requests only build and validate the component.
            *) echo "::error::Unknown build channel: $BUILD_CHANNEL"; exit 1 ;;
          esac
          if [[ -n "$tag" ]]; then
            echo "PUMPGSIT_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain and WASI target
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-wasip3

      - name: Install WASI SDK 34.0 and wasm-tools 1.263.0
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          curl -fsSL --retry 3 -o wasm-tools.tar.gz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-x86_64-linux.tar.gz
          sha256sum -c <<'CHECKSUMS'
          b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz
          21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431  wasm-tools.tar.gz
          CHECKSUMS
          mkdir wasi-sdk wasm-tools
          tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
          tar -xzf wasm-tools.tar.gz -C wasm-tools --strip-components=1
          {
            echo "WASI_SYSROOT=$RUNNER_TEMP/wasi-sdk/share/wasi-sysroot"
            echo "CC_wasm32_wasip3=$RUNNER_TEMP/wasi-sdk/bin/wasm32-wasip3-clang"
            echo "AR_wasm32_wasip3=$RUNNER_TEMP/wasi-sdk/bin/llvm-ar"
            echo "CXX_wasm32_wasip3=$RUNNER_TEMP/wasi-sdk/bin/wasm32-wasip3-clang++"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Compile, check the ABI and package PumpGsit
        run: bash .github/scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PumpGsit
          path: |
            target/release-assets/PumpGsit.wasm
            target/release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.channel == 'release' || inputs.channel == 'nightly'
    needs: [checks, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PumpGsit
          path: release-assets
      - name: Publish the verified build
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.wasm.outputs.release_tag }}
          PLUGIN_VERSION: ${{ needs.wasm.outputs.plugin_version }}
        run: bash .github/scripts/publish.sh
