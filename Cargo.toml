[package]
name = "PumpGsit"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-only"
description = "Seats, poses and crawling for Pumpkin using its Wasm 0.2 plugin API"
repository = "https://github.com/Q2297045667/PumpGsit"

[lib]
name = "pumpgsit"
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "wasm32-wasi-vfs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
turnloop-mysql = "=0.1.0-beta.2"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
uuid = "1"
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["async", "macros", "std", "bitflags", "realloc"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false }
